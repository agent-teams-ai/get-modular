name: Optional upstream compiler growth diagnostic

on:
  push:
    branches: [test/fixture-growth-upstream-diagnostic]

permissions:
  contents: read

jobs:
  original-n1000:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Install the unchanged supported toolchain and prepare package outputs
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --engine-strict --strict-peer-dependencies
          pnpm lockfile:peers:check
          pnpm assembly:build
          pnpm resources:build
          pnpm conformance:build
          pnpm assembly:typecheck
      - name: Build the exact upstream candidate and measure the original N1000 subject once
        run: node tests/qualification/consumer-fixtures/growth/upstream-compiler.ts --directory "${{ runner.temp }}/gm-upstream-growth"
      - name: Verify tracked workspace integrity
        if: always()
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: node architecture/checks/tracked-workspace-integrity.mjs
      - name: Retain candidate provenance and all selected fixture outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-growth-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gm-upstream-growth/*.json
            ${{ runner.temp }}/gm-upstream-growth/*.log
            ${{ runner.temp }}/gm-upstream-growth/*.txt
            ${{ runner.temp }}/gm-upstream-growth/tsc
            ${{ runner.temp }}/gm-upstream-growth/gm-growth-1000-*
          if-no-files-found: warn
