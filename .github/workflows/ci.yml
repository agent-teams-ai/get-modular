name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: CI impact selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.select.outputs.tier }}
    steps:
      - name: Check out reviewed merge source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Select safe scope from the reviewed base branch
        id: select
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub's event base.sha may lag changes on stacked PR base branches.
          # Only inspect the current base if it is an ancestor of this exact
          # reviewed merge SHA; otherwise conservatively require full CI.
          if [[ "$PR_BASE_REF" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,199}$ ]] &&
             [[ "$PR_BASE_REF" != *..* && "$PR_BASE_REF" != *//* ]] &&
             git fetch --no-tags origin "refs/heads/$PR_BASE_REF" &&
             CI_BASE_SHA="$(git rev-parse FETCH_HEAD)" &&
             [[ "$CI_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] &&
             git merge-base --is-ancestor "$CI_BASE_SHA" "$GITHUB_SHA" &&
             git cat-file -e "${CI_BASE_SHA}:architecture/tooling/ci-impact.mjs"; then
            git show "${CI_BASE_SHA}:architecture/tooling/ci-impact.mjs" > "$RUNNER_TEMP/gm-ci-impact-trusted.mjs"
            CI_BASE_SHA="$CI_BASE_SHA" node "$RUNNER_TEMP/gm-ci-impact-trusted.mjs"
          else
            echo "Trusted current base not part of reviewed merge; full native CI"
            echo "tier=full" >> "$GITHUB_OUTPUT"
          fi

  ci-impact-tests:
    name: CI impact contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node --test tests/ci-impact.test.mjs

  docs-protocol:
    name: Scoped docs protocol
    needs: [impact, ci-impact-tests]
    if: needs.impact.result == 'success' && needs.ci-impact-tests.result == 'success' && (needs.impact.outputs.tier == 'docs' || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install and verify frozen workspace
        run: |
          node architecture/tooling/runtime/retained-history.ts
          node architecture/tooling/runtime/dev.ts install
          node architecture/tooling/runtime/dev.ts peers
      - name: Qualify maintained docs protocol and quality
        run: bun run docs:protocol:check
      - name: Verify tracked workspace integrity
        run: node architecture/tooling/runtime/dev.ts verify
  lanes-ubuntu:
    name: check lane (ubuntu-24.04, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: &check-lane-matrix
        include:
          - lane: core
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build conformance:build observation:build effect:build core:typecheck:prepared core:test
          - lane: assembly
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build conformance:build observation:build effect:build assembly:typecheck assembly:test
          - lane: packaging
            scripts: runtime:preflight governance:check assembly:build lifecycle:check resources:check conformance:check observation:build effect:check foundation:check sdk-growth:check lint:typed
          - lane: governance
            scripts: ownership:checkpoint:test runtime:preflight runtime:policy:typecheck runtime:policy:test governance:check release-owned-files:check assembly:build lifecycle:build resources:build conformance:build observation:build effect:build governance:test
          - lane: static
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build conformance:build observation:build effect:build docs:protocol:check architecture:feature-module-profile architecture:feature-module-profile:test contracts:check contracts:test qualification:resource-profile qualification:v1-diagnostics-protocol qualification:v1-graph-semantics qualification:self-composition-templates
          - lane: observation
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build conformance:build observation:check effect:build
    steps: &check-lane-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.ROOT_CI_NODE_VERSION }}
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Provision the exact detached retained observation history
        run: node architecture/tooling/runtime/retained-history.ts
      - name: Prepare the isolated Node profile when selected
        run: node architecture/tooling/runtime/ci.ts
      - name: Install the actual root with strict frozen policy
        working-directory: ${{ env.GM_RUNTIME_CHECKOUT || github.workspace }}
        run: node architecture/tooling/runtime/dev.ts install
      - name: Validate the committed peer graph
        working-directory: ${{ env.GM_RUNTIME_CHECKOUT || github.workspace }}
        run: node architecture/tooling/runtime/dev.ts peers
      - name: Run check lane with its build prerequisites
        env:
          LANE_SCRIPTS: ${{ matrix.scripts }}
          FOUNDATION_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SDK_GROWTH_FAILURE_ARTIFACT: ${{ runner.temp }}/sdk-growth-failure.json
          SDK_GROWTH_CHECKOUT_SHA: ${{ github.sha }}
          WORKFLOW_SUBPROCESS_FAILURE_ARTIFACT: ${{ runner.temp }}/workflow-subprocess-failure.json
        working-directory: ${{ env.GM_RUNTIME_CHECKOUT || github.workspace }}
        run: node architecture/tooling/run-ci-check-lane.mjs
      - name: Verify tracked workspace integrity
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        working-directory: ${{ env.GM_RUNTIME_CHECKOUT || github.workspace }}
        run: node architecture/tooling/runtime/dev.ts verify
      # Earlier packaging failures and expected SDK exits may leave no SDK file.
      - name: Retain bounded SDK growth failure evidence
        if: failure() && matrix.lane == 'packaging'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, reused from m3-runtime-matrix
        with:
          name: sdk-growth-${{ runner.os }}-${{ env.ROOT_CI_NODE_VERSION || '26.11.1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-growth-failure.json
          if-no-files-found: ignore
      - name: Retain bounded workflow subprocess failure evidence
        if: failure() && matrix.lane == 'static'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, same retained-evidence owner
        with:
          name: workflow-subprocess-${{ runner.os }}-${{ env.ROOT_CI_RUNTIME_PROFILE || 'bun' }}-${{ env.ROOT_CI_NODE_VERSION || '26.11.1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-subprocess-failure.json
          if-no-files-found: ignore

  lanes-macos:
    name: check lane (macos-15, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  lanes-windows:
    name: check lane (windows-2025, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.lane == 'governance' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  check-ubuntu:
    name: check (ubuntu-24.04)
    runs-on: ubuntu-24.04
    needs: [impact, ci-impact-tests, docs-protocol, lanes-ubuntu]
    if: always()
    steps: &check-aggregate-steps
      - name: Enforce exact docs/full CI evidence
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IMPACT_TIER: ${{ needs.impact.outputs.tier }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          jq -e --arg tier "$IMPACT_TIER" --arg event "$CI_EVENT_NAME" '
            (.impact.result == "success") and
            (.["ci-impact-tests"].result == "success") and
            (if $tier == "docs" or ($tier == "full" and $event != "pull_request")
              then .["docs-protocol"].result == "success"
             elif $tier == "full" and $event == "pull_request"
              then .["docs-protocol"].result == "skipped"
             else false end) and
            (to_entries | map(select(.key != "impact" and .key != "ci-impact-tests" and .key != "docs-protocol"))
             | length > 0 and all(.value.result == (if $tier == "full" then "success" else "skipped" end)))
          ' <<< "$NEEDS_JSON"

  check-macos:
    name: check (macos-15)
    runs-on: ubuntu-24.04
    needs: [impact, ci-impact-tests, docs-protocol, lanes-macos]
    if: always()
    steps: *check-aggregate-steps

  check-windows:
    name: check (windows-2025)
    runs-on: windows-2025
    needs: [impact, ci-impact-tests, docs-protocol, lanes-windows]
    if: always()
    steps: *check-aggregate-steps

  lanes-node24-ubuntu:
    name: check lane (ubuntu-24.04, Node 24, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: &node24-root-runtime
      ROOT_CI_NODE_VERSION: 24.21.0
      ROOT_CI_RUNTIME_PROFILE: node
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  lanes-node24-macos:
    name: check lane (macos-15, Node 24, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: macos-15
    timeout-minutes: 15
    env: *node24-root-runtime
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  lanes-node24-windows:
    name: check lane (windows-2025, Node 24, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.lane == 'governance' && 20 || 15 }}
    env: *node24-root-runtime
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  check-node24-ubuntu:
    name: check (ubuntu-24.04, Node 24)
    runs-on: ubuntu-24.04
    needs: [impact, ci-impact-tests, docs-protocol, lanes-node24-ubuntu, node-24-compatibility]
    if: always()
    steps: *check-aggregate-steps

  check-node24-macos:
    name: check (macos-15, Node 24)
    runs-on: ubuntu-24.04
    needs: [impact, ci-impact-tests, docs-protocol, lanes-node24-macos]
    if: always()
    steps: *check-aggregate-steps

  check-node24-windows:
    name: check (windows-2025, Node 24)
    runs-on: windows-2025
    needs: [impact, ci-impact-tests, docs-protocol, lanes-node24-windows]
    if: always()
    steps: *check-aggregate-steps

  lanes-node26-ubuntu:
    name: check lane (ubuntu-24.04, Node 26 rollback, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROOT_CI_NODE_VERSION: 26.11.1
      ROOT_CI_RUNTIME_PROFILE: node
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  check-node26-ubuntu:
    name: check (ubuntu-24.04, Node 26 rollback)
    runs-on: ubuntu-24.04
    needs: [impact, ci-impact-tests, docs-protocol, lanes-node26-ubuntu]
    if: always()
    steps: *check-aggregate-steps

  lanes-node26-macos:
    name: check lane (macos-15, Node 26 rollback, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      ROOT_CI_NODE_VERSION: 26.11.1
      ROOT_CI_RUNTIME_PROFILE: node
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  check-node26-macos:
    name: check (macos-15, Node 26 rollback)
    runs-on: ubuntu-24.04
    needs: [impact, ci-impact-tests, docs-protocol, lanes-node26-macos]
    if: always()
    steps: *check-aggregate-steps

  lanes-node26-windows:
    name: check lane (windows-2025, Node 26 rollback, ${{ matrix.lane }})
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.lane == 'governance' && 20 || 15 }}
    env:
      ROOT_CI_NODE_VERSION: 26.11.1
      ROOT_CI_RUNTIME_PROFILE: node
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  check-node26-windows:
    name: check (windows-2025, Node 26 rollback)
    runs-on: windows-2025
    needs: [impact, ci-impact-tests, docs-protocol, lanes-node26-windows]
    if: always()
    steps: *check-aggregate-steps

  node-24-compatibility:
    name: Node 24 package root compatibility
    needs: impact
    if: needs.impact.outputs.tier == 'full'
    env:
      ROOT_CI_RUNTIME_PROFILE: node
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Provision the exact detached retained observation history
        run: node architecture/tooling/runtime/retained-history.ts
      - name: Prepare isolated Node compatibility checkout
        run: node architecture/tooling/runtime/ci.ts
      - name: Build and pack libraries with the default Node 26 tooling
        working-directory: ${{ env.GM_RUNTIME_CHECKOUT }}
        run: |
          node architecture/tooling/runtime/dev.ts install
          pnpm peers check --lockfile-only
          pnpm assembly:build
          pnpm resources:build
          pnpm conformance:build
          pnpm observation:build
          mkdir -p "$RUNNER_TEMP/node24-pack"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/node24-pack"
          pnpm --dir packages/assembly pack --pack-destination "$RUNNER_TEMP/node24-pack"
          pnpm --dir packages/resources pack --pack-destination "$RUNNER_TEMP/node24-pack"
          pnpm --dir packages/conformance pack --pack-destination "$RUNNER_TEMP/node24-pack"
          pnpm --dir packages/observation pack --pack-destination "$RUNNER_TEMP/node24-pack"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Provision pinned pnpm for disposable Node 24 fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/node24-pnpm" --no-save --ignore-scripts --no-audit --no-fund pnpm@11.20.0
          node "$RUNNER_TEMP/node24-pnpm/node_modules/pnpm/bin/pnpm.mjs" --pm-on-fail=ignore --version | grep -Fx 11.20.0
      - name: Verify disposable installed public consumer on Node 24
        env:
          GET_MODULAR_COMPAT_ARCHIVE_DIR: ${{ runner.temp }}/node24-pack
          GET_MODULAR_COMPAT_PNPM_CLI: ${{ runner.temp }}/node24-pnpm/node_modules/pnpm/bin/pnpm.mjs
        working-directory: ${{ env.GM_RUNTIME_CHECKOUT }}
        run: node --no-warnings --test tests/node-runtime-compatibility.test.mjs
