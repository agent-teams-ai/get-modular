name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanes-ubuntu:
    name: check lane (ubuntu-24.04, ${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: &check-lane-matrix
        include:
          - lane: core
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build core:typecheck:prepared core:test
          - lane: assembly
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build assembly:typecheck assembly:test
          - lane: packaging
            scripts: runtime:preflight governance:check assembly:build lifecycle:check resources:check foundation:check sdk-growth:check lint:typed
          - lane: governance
            scripts: ownership:checkpoint:test runtime:preflight governance:check release-owned-files:check assembly:build lifecycle:build resources:build governance:test
          - lane: static
            scripts: runtime:preflight governance:check assembly:build lifecycle:build resources:build docs:protocol:check architecture:feature-module-profile architecture:feature-module-profile:test contracts:check contracts:test qualification:resource-profile qualification:v1-diagnostics-protocol qualification:v1-graph-semantics qualification:self-composition-templates
    steps: &check-lane-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run check lane with its build prerequisites
        env:
          LANE_SCRIPTS: ${{ matrix.scripts }}
          FOUNDATION_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node architecture/tooling/run-ci-check-lane.mjs
      - name: Verify tracked workspace integrity
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: node architecture/checks/tracked-workspace-integrity.mjs

  lanes-macos:
    name: check lane (macos-15, ${{ matrix.lane }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  lanes-windows:
    name: check lane (windows-2025, ${{ matrix.lane }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *check-lane-matrix
    steps: *check-lane-steps

  check-ubuntu:
    name: check (ubuntu-24.04)
    runs-on: ubuntu-24.04
    needs: [lanes-ubuntu]
    if: always()
    steps: &check-aggregate-steps
      - name: Require every check lane to succeed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'to_entries | length > 0 and all(.value.result == "success")' <<< "$NEEDS_JSON"

  check-macos:
    name: check (macos-15)
    runs-on: macos-15
    needs: [lanes-macos]
    if: always()
    steps: *check-aggregate-steps

  check-windows:
    name: check (windows-2025)
    runs-on: windows-2025
    needs: [lanes-windows]
    if: always()
    steps: *check-aggregate-steps

  node-26-compatibility:
    name: Node 26 package root compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build and pack libraries with qualified Node 24 tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm peers check --lockfile-only
          pnpm assembly:build
          pnpm resources:build
          mkdir -p "$RUNNER_TEMP/node26-pack"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/node26-pack"
          pnpm --dir packages/assembly pack --pack-destination "$RUNNER_TEMP/node26-pack"
          pnpm --dir packages/resources pack --pack-destination "$RUNNER_TEMP/node26-pack"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Provision pinned pnpm for disposable Node 26 fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/node26-pnpm" --no-save --ignore-scripts --no-audit --no-fund pnpm@11.20.0
          node "$RUNNER_TEMP/node26-pnpm/node_modules/pnpm/bin/pnpm.mjs" --version | grep -Fx 11.20.0
      - name: Verify disposable installed public consumer on Node 26
        env:
          GET_MODULAR_COMPAT_ARCHIVE_DIR: ${{ runner.temp }}/node26-pack
          GET_MODULAR_COMPAT_PNPM_CLI: ${{ runner.temp }}/node26-pnpm/node_modules/pnpm/bin/pnpm.mjs
        run: node --no-warnings --test tests/node-runtime-compatibility.test.mjs
