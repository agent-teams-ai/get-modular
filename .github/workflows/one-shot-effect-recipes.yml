name: One-shot communication recipe qualification
on:
  push:
    branches: [work/effect-recipes-stage-20261114]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'agent-teams-ai/get-modular' && github.actor == '777genius' && github.ref == 'refs/heads/work/effect-recipes-stage-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      SOURCE_SHA: 24844e3f06b35468a72a94410517505946899efb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed patch and select exact source
        run: |
          set -euo pipefail
          cp .recipe-ops/qualification.patch "$RUNNER_TEMP/qualification.patch"
          git checkout --detach "$SOURCE_SHA"
          test ! -e .recipe-ops
          test ! -e .github/workflows/one-shot-effect-recipes.yml
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install the unchanged pinned workspace
        run: |
          node architecture/tooling/runtime/retained-history.ts
          node architecture/tooling/runtime/dev.ts install
          node architecture/tooling/runtime/dev.ts peers
      - name: Apply exact-source patch and publish only a staging ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git apply --check "$RUNNER_TEMP/qualification.patch"
          git apply --index "$RUNNER_TEMP/qualification.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf 'packages/effect/docs/practices.md\npackages/effect/tests/communication.test.ts')"
          git config --local user.name iliya
          git config --local user.email iliyazelenkog@gmail.com
          git commit -m 'test(effect): strengthen subscription retirement and slow-state consumer evidence'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git show -s --format='%an|%ae|%cn|%ce' HEAD)" = 'iliya|iliyazelenkog@gmail.com|iliya|iliyazelenkog@gmail.com'
          cat > "$RUNNER_TEMP/recipe-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/recipe-askpass"
          ref="work/effect-recipes-source-$GITHUB_RUN_ID"
          GIT_ASKPASS="$RUNNER_TEMP/recipe-askpass" git -c credential.helper= push https://github.com/agent-teams-ai/get-modular.git "HEAD:refs/heads/$ref"
          printf 'Source commit: %s\nSource ref: %s\n' "$(git rev-parse HEAD)" "$ref" | tee "$RUNNER_TEMP/recipe-source.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "EXPECTED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/recipe-source.tar.gz"
      - name: Retain an offline copy of the exact installed qualification environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recipe-tools/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/recipe-tools/bin/node"
          cp "$(command -v bun)" "$RUNNER_TEMP/recipe-tools/bin/bun"
          node --version > "$RUNNER_TEMP/recipe-tools/versions.txt"
          bun --version >> "$RUNNER_TEMP/recipe-tools/versions.txt"
          node node_modules/typescript/bin/tsc --version >> "$RUNNER_TEMP/recipe-tools/versions.txt"
          tar -czf "$RUNNER_TEMP/recipe-dependencies.tar.gz" node_modules
          tar -czf "$RUNNER_TEMP/recipe-tools.tar.gz" -C "$RUNNER_TEMP/recipe-tools" .
          git bundle create "$RUNNER_TEMP/recipe-history.bundle" --all HEAD
          sha256sum bun.lock package.json > "$RUNNER_TEMP/recipe-inputs.sha256"
      - name: Qualify maintained examples through workspace and installed public packages
        run: |
          bun run assembly:build
          bun run resources:build
          bun run conformance:build
          bun run observation:build
          bun run effect:check
      - name: Verify documentation and changed-source gate
        run: |
          bun run docs:protocol:check
          bun run check:changed
      - name: Verify tracked source integrity
        if: always()
        run: node architecture/tooling/runtime/dev.ts verify
      - name: Retain source and frozen test environment without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recipe-qualification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recipe-source.txt
            ${{ runner.temp }}/recipe-source.tar.gz
            ${{ runner.temp }}/recipe-dependencies.tar.gz
            ${{ runner.temp }}/recipe-tools.tar.gz
            ${{ runner.temp }}/recipe-history.bundle
            ${{ runner.temp }}/recipe-inputs.sha256
          if-no-files-found: error
          retention-days: 2
