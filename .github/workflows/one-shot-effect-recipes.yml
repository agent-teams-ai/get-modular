name: One-shot communication recipe qualification
on:
  push:
    branches: [work/effect-recipes-stage-20261114]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'agent-teams-ai/get-modular' && github.actor == '777genius' && github.ref == 'refs/heads/work/effect-recipes-stage-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 57ee9ddfaf2948b0133f6902a6e30139c73c7865
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact reviewed source and base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 57ee9ddfaf2948b0133f6902a6e30139c73c7865
          test "$(git rev-parse HEAD^{tree})" = cd01f750cd0d398139926754bd400807e7a6e0c2
          git branch --force main ea5c3ade592ce5367dcae11694a20471464e4ab6
          git merge-base --is-ancestor main HEAD
          test ! -e .recipe-ops
          test ! -e .github/workflows/one-shot-effect-recipes.yml
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install the unchanged pinned workspace
        run: |
          node architecture/tooling/runtime/retained-history.ts
          node architecture/tooling/runtime/dev.ts install
          node architecture/tooling/runtime/dev.ts peers
      - name: Reject the contaminated auxiliary environment and prove the clean control
        run: |
          set -euo pipefail
          file=tests/repository-runtime.test.ts
          pattern='^Node rollback derives only manager metadata in an external checkout and rejects drift$'
          set +e
          EXPECTED_HEAD_SHA=57ee9ddfaf2948b0133f6902a6e30139c73c7865 node --test --test-name-pattern="$pattern" "$file" > "$RUNNER_TEMP/recipe-environment-negative.log" 2>&1
          negative=$?
          set -e
          test "$negative" -eq 1
          grep -q 'TRACKED_FILE_CUSTODY_FAILED' "$RUNNER_TEMP/recipe-environment-negative.log"
          grep -q 'does not match expected commit' "$RUNNER_TEMP/recipe-environment-negative.log"
          env -u EXPECTED_HEAD_SHA node --test --test-name-pattern="$pattern" "$file" | tee "$RUNNER_TEMP/recipe-environment-positive.log"
      - name: Run the complete changed-source qualification
        run: |
          set -euo pipefail
          # EXPECTED_HEAD_SHA belongs only to the final integrity step. Child
          # fixture repositories have their own independently checked HEADs.
          test -z "${EXPECTED_HEAD_SHA:-}"
          bun run check:changed 2>&1 | tee "$RUNNER_TEMP/recipe-check-changed.log"
      - name: Verify tracked source integrity
        if: always()
        env:
          EXPECTED_HEAD_SHA: 57ee9ddfaf2948b0133f6902a6e30139c73c7865
        run: node architecture/tooling/runtime/dev.ts verify
      - name: Retain exact-source gate receipts without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recipe-final-gates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recipe-environment-negative.log
            ${{ runner.temp }}/recipe-environment-positive.log
            ${{ runner.temp }}/recipe-check-changed.log
          if-no-files-found: error
          retention-days: 7
