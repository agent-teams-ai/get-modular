name: One-shot communication recipe qualification
on:
  push:
    branches: [work/effect-recipes-stage-20261114]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'agent-teams-ai/get-modular' && github.actor == '777genius' && github.ref == 'refs/heads/work/effect-recipes-stage-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SOURCE_SHA: fc0c0db982051a82b7a362992bab21c6fda45f4d
      REVIEWED_TREE: 5a7727891a5eb3ef5c5c5fed286d9f85a2466627
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the exact locally reviewed patch and push its source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp .recipe-ops/deep-review.patch "$RUNNER_TEMP/deep-review.patch"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = c99fa4a47b5213dabefedca68c5c987d14906715
          test ! -e .recipe-ops
          test ! -e .github/workflows/one-shot-effect-recipes.yml
          git apply --check "$RUNNER_TEMP/deep-review.patch"
          git apply --index "$RUNNER_TEMP/deep-review.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$REVIEWED_TREE"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 8
          git config --local user.name iliya
          git config --local user.email iliyazelenkog@gmail.com
          git commit -m 'fix(effect): isolate fixture subscriptions and clarify communication review contracts'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          cat > "$RUNNER_TEMP/recipe-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token;;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/recipe-askpass"
          ref="work/effect-recipes-source-$GITHUB_RUN_ID"
          GIT_ASKPASS="$RUNNER_TEMP/recipe-askpass" git -c credential.helper= push https://github.com/agent-teams-ai/get-modular.git "HEAD:refs/heads/$ref"
          printf 'Source commit: %s\nSource ref: %s\n' "$(git rev-parse HEAD)" "$ref" | tee "$RUNNER_TEMP/recipe-source.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/recipe-history.bundle" --all HEAD
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install the unchanged pinned workspace
        run: |
          node architecture/tooling/runtime/retained-history.ts
          node architecture/tooling/runtime/dev.ts install
          node architecture/tooling/runtime/dev.ts peers
      - name: Run maintained communication and installed-archive checks
        run: |
          bun run assembly:build
          bun run resources:build
          bun run conformance:build
          bun run observation:build
          bun run effect:check
      - name: Check architecture, typed lint and documentation
        run: |
          bun run foundation:check
          bun run lint:typed
          bun run docs:protocol:check
      - name: Verify tracked source integrity
        if: always()
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: node architecture/tooling/runtime/dev.ts verify
      - name: Retain exact source identity without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recipe-deep-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recipe-source.txt
            ${{ runner.temp }}/recipe-history.bundle
          if-no-files-found: error
          retention-days: 7
