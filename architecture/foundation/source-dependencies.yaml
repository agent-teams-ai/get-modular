schemaVersion: 1
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
governedRoots:
  - packages/core/src
boundaries:
  - id: core-diagnostics
    roots:
      - packages/core/src/features/diagnostics/types.ts
      - packages/core/src/features/diagnostics/order.ts
      - packages/core/src/features/diagnostics/collector.ts
      - packages/core/src/features/diagnostics/internal.ts
    entrypoints:
      - packages/core/src/features/diagnostics/internal.ts
    allow:
      boundaries:
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-plan-output-contract
    roots:
      - packages/core/src/features/plan-output/ports.ts
      - packages/core/src/features/plan-output/declaration.ts
    entrypoints:
      - packages/core/src/features/plan-output/ports.ts
      - packages/core/src/features/plan-output/declaration.ts
    allow:
      boundaries:
        - core-authoring
        - core-canonicalization-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-plan-output-implementation
    roots:
      - packages/core/src/features/plan-output/factory.ts
    entrypoints:
      - packages/core/src/features/plan-output/factory.ts
    allow:
      boundaries:
        - core-plan-output-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-authoring
    roots:
      - packages/core/src/features/authoring/wire-types.ts
      - packages/core/src/features/authoring/diagnostic-types.ts
      - packages/core/src/features/authoring/helpers.ts
      - packages/core/src/features/authoring/internal.ts
    entrypoints:
      - packages/core/src/features/authoring/internal.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  # Enumerate only materialized source. New features and layers need an explicit
  # ownership edge in this policy, including otherwise dependency-free files.
  - id: core-canonicalization-contract
    roots:
      - packages/core/src/features/canonicalization/ports.ts
      - packages/core/src/features/canonicalization/identity.ts
    entrypoints:
      - packages/core/src/features/canonicalization/ports.ts
      - packages/core/src/features/canonicalization/identity.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-canonicalization-owned-jcs
    roots:
      - packages/core/src/features/canonicalization/owned-jcs/declaration.ts
      - packages/core/src/features/canonicalization/owned-jcs/factory.ts
    entrypoints:
      - packages/core/src/features/canonicalization/owned-jcs/declaration.ts
      - packages/core/src/features/canonicalization/owned-jcs/factory.ts
    allow:
      boundaries:
        - core-canonicalization-contract
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
