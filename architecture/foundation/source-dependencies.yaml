schemaVersion: 3
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
packageRoots:
  - packages/assembly
  - packages/core
rootPackage: true
governedRoots:
  - architecture/checks
  - architecture/tooling
  - packages/assembly/examples
  - packages/assembly/src
  - packages/assembly/tests
  - packages/core/dist-seed
  - packages/core/dist-stage0
  - packages/core/dist-test
  - packages/core/self-composition
  - packages/core/src
  - packages/core/tests
  - tests
boundaries:
  # Module consumers see only ports and identities. Only a composition root
  # may depend on the separate implementation boundary and its factory.
  - id: core-composition-semantics-contract
    roots:
      - packages/core/src/features/composition-semantics/ports.ts
      - packages/core/src/features/composition-semantics/declaration.ts
    entrypoints:
      - packages/core/src/features/composition-semantics/ports.ts
      - packages/core/src/features/composition-semantics/declaration.ts
    allow:
      boundaries:
        - core-authoring
        - core-diagnostics
        - core-canonicalization-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-composition-semantics
    roots:
      - packages/core/src/features/composition-semantics/graph-components.ts
      - packages/core/src/features/composition-semantics/ready-queue.ts
      - packages/core/src/features/composition-semantics/selected-graph.ts
      - packages/core/src/features/composition-semantics/graph-diagnostics.ts
      - packages/core/src/features/composition-semantics/declaration-census.ts
      - packages/core/src/features/composition-semantics/profile-census.ts
      - packages/core/src/features/composition-semantics/binding-record.ts
      - packages/core/src/features/composition-semantics/selected-bindings.ts
      - packages/core/src/features/composition-semantics/graph-resources.ts
      - packages/core/src/features/composition-semantics/semantic-analysis.ts
      - packages/core/src/features/composition-semantics/factory.ts
    entrypoints:
      - packages/core/src/features/composition-semantics/factory.ts
    allow:
      boundaries:
        - core-composition-semantics-contract
        - core-diagnostics
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
  # Admission receives a per-call sink, not another own-graph dependency.
  - id: core-input-admission-contract
    roots:
      - packages/core/src/features/input-admission/ports.ts
      - packages/core/src/features/input-admission/declaration.ts
    entrypoints:
      - packages/core/src/features/input-admission/ports.ts
      - packages/core/src/features/input-admission/declaration.ts
    allow:
      boundaries:
        - core-authoring
        - core-diagnostics
        - core-raw-scanner-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-input-admission
    roots:
      - packages/core/src/features/input-admission/document-reader.ts
      - packages/core/src/features/input-admission/byte-carrier.ts
      - packages/core/src/features/input-admission/raw-integer.ts
      - packages/core/src/features/input-admission/raw-document.ts
      - packages/core/src/features/input-admission/raw-duplicate-replay.ts
      - packages/core/src/features/input-admission/raw-numeric-admission.ts
      - packages/core/src/features/input-admission/raw-byte-input.ts
      - packages/core/src/features/input-admission/raw-admission.ts
      - packages/core/src/features/input-admission/invocation-wrapper.ts
      - packages/core/src/features/input-admission/object-resource-meter.ts
      - packages/core/src/features/input-admission/document-snapshot.ts
      - packages/core/src/features/input-admission/document-shape.ts
      - packages/core/src/features/input-admission/identity-format.ts
      - packages/core/src/features/input-admission/schema-diagnostic.ts
      - packages/core/src/features/input-admission/resource-limits.ts
      - packages/core/src/features/input-admission/document-path.ts
      - packages/core/src/features/input-admission/resource-diagnostic.ts
      - packages/core/src/features/input-admission/profile-resource-facts.ts
      - packages/core/src/features/input-admission/object-admission.ts
      - packages/core/src/features/input-admission/factory.ts
    entrypoints:
      - packages/core/src/features/input-admission/factory.ts
    allow:
      boundaries:
        - core-input-admission-contract
        - core-authoring
        - core-diagnostics
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-diagnostics
    roots:
      - packages/core/src/features/diagnostics/types.ts
      - packages/core/src/features/diagnostics/order.ts
      - packages/core/src/features/diagnostics/collector.ts
      - packages/core/src/features/diagnostics/internal.ts
    entrypoints:
      - packages/core/src/features/diagnostics/internal.ts
    allow:
      boundaries:
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-plan-output-contract
    roots:
      - packages/core/src/features/plan-output/ports.ts
      - packages/core/src/features/plan-output/declaration.ts
    entrypoints:
      - packages/core/src/features/plan-output/ports.ts
      - packages/core/src/features/plan-output/declaration.ts
    allow:
      boundaries:
        - core-authoring
        - core-canonicalization-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-plan-output-implementation
    roots:
      - packages/core/src/features/plan-output/factory.ts
    entrypoints:
      - packages/core/src/features/plan-output/factory.ts
    allow:
      boundaries:
        - core-plan-output-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-authoring
    roots:
      - packages/core/src/features/authoring/wire-types.ts
      - packages/core/src/features/authoring/diagnostic-types.ts
      - packages/core/src/features/authoring/helpers.ts
      - packages/core/src/features/authoring/internal.ts
    entrypoints:
      - packages/core/src/features/authoring/internal.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  # Enumerate only materialized source. New features and layers need an explicit
  # ownership edge in this policy, including otherwise dependency-free files.
  - id: core-canonicalization-contract
    roots:
      - packages/core/src/features/canonicalization/ports.ts
      - packages/core/src/features/canonicalization/identity.ts
    entrypoints:
      - packages/core/src/features/canonicalization/ports.ts
      - packages/core/src/features/canonicalization/identity.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-canonicalization-owned-jcs
    roots:
      - packages/core/src/features/canonicalization/owned-jcs/declaration.ts
      - packages/core/src/features/canonicalization/owned-jcs/factory.ts
    entrypoints:
      - packages/core/src/features/canonicalization/owned-jcs/declaration.ts
      - packages/core/src/features/canonicalization/owned-jcs/factory.ts
    allow:
      boundaries:
        - core-canonicalization-contract
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-raw-scanner-contract
    roots:
      - packages/core/src/features/raw-scanner/ports.ts
      - packages/core/src/features/raw-scanner/identity.ts
    entrypoints:
      - packages/core/src/features/raw-scanner/ports.ts
      - packages/core/src/features/raw-scanner/identity.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-raw-scanner-owned-iterative
    roots:
      - packages/core/src/features/raw-scanner/owned-iterative/declaration.ts
      - packages/core/src/features/raw-scanner/owned-iterative/factory.ts
      - packages/core/src/features/raw-scanner/owned-iterative/scanner.ts
    entrypoints:
      - packages/core/src/features/raw-scanner/owned-iterative/declaration.ts
      - packages/core/src/features/raw-scanner/owned-iterative/factory.ts
    allow:
      boundaries:
        - core-raw-scanner-contract
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-compiler-facade-contract
    roots:
      - packages/core/src/features/compiler-facade/ports.ts
      - packages/core/src/features/compiler-facade/declaration.ts
    entrypoints:
      - packages/core/src/features/compiler-facade/ports.ts
      - packages/core/src/features/compiler-facade/declaration.ts
    allow:
      boundaries:
        - core-authoring
        - core-diagnostics
        - core-input-admission-contract
        - core-composition-semantics-contract
        - core-plan-output-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-compiler-facade-implementation
    roots:
      - packages/core/src/features/compiler-facade/factory.ts
    entrypoints:
      - packages/core/src/features/compiler-facade/factory.ts
    allow:
      boundaries:
        - core-compiler-facade-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-direct-composition
    roots:
      - packages/core/src/composition/stage0.ts
    entrypoints:
      - packages/core/src/composition/stage0.ts
    allow:
      boundaries:
        - core-canonicalization-owned-jcs
        - core-raw-scanner-owned-iterative
        - core-composition-semantics
        - core-input-admission
        - core-plan-output-implementation
        - core-compiler-facade-implementation
        - core-compiler-facade-contract
        - core-authoring
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-generated-composition
    roots:
      - packages/core/src/composition/generated/stage1.ts
    entrypoints:
      - packages/core/src/composition/generated/stage1.ts
    allow:
      boundaries:
        - core-canonicalization-owned-jcs
        - core-raw-scanner-owned-iterative
        - core-composition-semantics
        - core-input-admission
        - core-plan-output-implementation
        - core-compiler-facade-implementation
        - core-compiler-facade-contract
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-public-entrypoint
    packageExports:
      - "."
    roots:
      - packages/core/src/index.ts
    entrypoints:
      - packages/core/src/index.ts
    allow:
      boundaries:
        - core-authoring
        - core-generated-composition
      packages: []
      builtins: []
      runtimeReferences: []
  # ADR-0023 keeps construction contracts and implementation in one feature.
  # Assembly reaches Core only through its public package root.
  - id: assembly-construction
    roots:
      - packages/assembly/src/features/construction
    entrypoints:
      - packages/assembly/src/features/construction/types.ts
      - packages/assembly/src/features/construction/factory.ts
    allow:
      boundaries: []
      packages:
        - "@get-modular/core"
      builtins: []
      runtimeReferences: []
  - id: assembly-composition
    roots:
      - packages/assembly/src/composition/root.ts
    entrypoints:
      - packages/assembly/src/composition/root.ts
    allow:
      boundaries:
        - assembly-construction
      packages: ["@get-modular/core"]
      builtins: []
      runtimeReferences: []
  - id: assembly-public-entrypoint
    packageExports:
      - "."
    roots:
      - packages/assembly/src/index.ts
    entrypoints:
      - packages/assembly/src/index.ts
    allow:
      boundaries:
        - assembly-construction
        - assembly-composition
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core-development
    dependencyMode: development
    roots:
      - packages/core/dist-seed
      - packages/core/dist-stage0
      - packages/core/dist-test
      - packages/core/self-composition
      - packages/core/tests
    entrypoints:
      - packages/core/self-composition/emit.ts
      - packages/core/tests/features/canonicalization/witness-variant/declaration.ts
      - packages/core/tests/features/canonicalization/witness-variant/factory.ts
      - packages/core/tests/package/build-closure.test.mjs
    allow:
      boundaries:
        - core-authoring
        - core-canonicalization-contract
        - core-canonicalization-owned-jcs
        - core-compiler-facade-contract
        - core-compiler-facade-implementation
        - core-composition-semantics
        - core-composition-semantics-contract
        - core-diagnostics
        - core-direct-composition
        - core-generated-composition
        - core-input-admission
        - core-input-admission-contract
        - core-plan-output-contract
        - core-plan-output-implementation
        - core-public-entrypoint
        - core-raw-scanner-contract
        - core-raw-scanner-owned-iterative
        - repository.development
      packages:
        - "@get-modular/core"
        - ajv
        - canonicalize
        - json-canonicalize
        - tar
        - typescript
        - typescript-minimum
        - yaml
      builtins:
        - node:assert
        - node:assert/strict
        - node:buffer
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:http
        - node:module
        - node:os
        - node:path
        - node:test
        - node:timers/promises
        - node:url
        - node:util
        - node:util/types
        - node:vm
        - node:worker_threads
        - node:zlib
      runtimeReferences:
        - commonjs
        - dynamic
  - id: assembly-internal-tests
    dependencyMode: development
    roots:
      - packages/assembly/tests
    entrypoints:
      - packages/assembly/tests/bounds.test.mjs
    allow:
      boundaries:
        - assembly-composition
        - assembly-construction
        - assembly-examples
        - assembly-public-entrypoint
      packages:
        - "@get-modular/core"
      builtins:
        - node:assert/strict
        - node:test
        - node:async_hooks
      runtimeReferences: []
  - id: assembly-examples
    dependencyMode: development
    roots:
      - packages/assembly/examples
    entrypoints:
      - packages/assembly/examples/basic-host.mjs
    allow:
      boundaries:
        - assembly-public-entrypoint
      packages:
        - "@get-modular/core"
      builtins:
        - node:url
      runtimeReferences: []
  - id: repository.development
    dependencyMode: development
    roots:
      - architecture/checks
      - architecture/tooling
      - tests
    entrypoints:
      - architecture/checks/assembly-admission.mjs
      - architecture/checks/feature-module-standard-profile.mjs
      - architecture/checks/generated-production-source.mjs
      - architecture/checks/governance.mjs
      - architecture/checks/implementation-clarifications.mjs
      - architecture/checks/m2-evidence.mjs
      - architecture/checks/m2-lock-witness.mjs
      - architecture/checks/node-version.mjs
      - architecture/checks/object-resource-coverage.mjs
      - architecture/checks/private-core-start.mjs
      - architecture/checks/production-artifacts.mjs
      - architecture/checks/retained-descriptor-source.mjs
      - architecture/checks/tracked-file-custody.mjs
      - architecture/checks/v1-contract.mjs
      - architecture/checks/v1-qualification.mjs
      - architecture/tooling/build-assembly.mjs
      - architecture/tooling/build-core.mjs
      - architecture/tooling/first-core-release.mjs
      - architecture/tooling/generate-core.mjs
      - architecture/tooling/test-assembly-types.mjs
      - tests/qualification/m2-candidate/combined-case-inventory.mjs
      - tests/qualification/m2-candidate/generation-two-artifacts.mjs
      - tests/source-dependencies.test.mjs
    allow:
      boundaries:
        - assembly-examples
        - assembly-public-entrypoint
        - core-public-entrypoint
      packages:
        - "@agent-teams/engineering-foundation"
        - "@get-modular/assembly"
        - "@get-modular/core"
        - ajv
        - canonicalize
        - json-canonicalize
        - jsonc-parser
        - tar
        - typescript
        - typescript-minimum
        - yaml
      builtins:
        - node:assert
        - node:assert/strict
        - node:async_hooks
        - node:buffer
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:http
        - node:module
        - node:os
        - node:path
        - node:perf_hooks
        - node:process
        - node:test
        - node:timers/promises
        - node:url
        - node:util
        - node:util/types
        - node:vm
        - node:zlib
      runtimeReferences:
        - commonjs
        - dynamic
