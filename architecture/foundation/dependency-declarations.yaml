schemaVersion: 2
packageManager:
  kind: bun
  workspaceManifest: pnpm-workspace.yaml
policies:
  externalDependencies: catalog
  catalogVersions: exact
  internalDependencies: workspace-protocol
  reservedScopes:
    - "@get-modular/"
  developmentOnlyPackages:
    - "@types/node"
    - ajv
    - canonicalize
    - cspell
    - json-canonicalize
    - jsonc-parser
    - markdownlint-cli2
    - oxlint
    - oxlint-tsgolint
    - pnpm
    - tar
    - ts-morph
    - typescript
    - typescript-minimum
  exactRegistryDevelopmentOnlyPackages:
    - "@agent-teams/docs-protocol"
    - "@agent-teams/engineering-foundation"
    - "@agent-teams/feature-module-standard"
    - "stack-toolchain"
