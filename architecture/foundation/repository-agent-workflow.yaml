schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: docs
    script: docs:changed
    extensions: [.md, .yaml, .yml]
    passPaths: false
fullScanPaths:
  - .github/workflows
  - architecture
  - docs
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
