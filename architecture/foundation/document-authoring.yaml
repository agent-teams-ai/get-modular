schemaVersion: 2
projectId: get-modular
catalog:
  metadataSchemaPath: docs/metadata.schema.json
  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1
  collections:
    - kind: markdown-tree
      root: docs
  excludedPrefixes:
    - docs/templates
authoring:
  mode: create-only
  artifactTypes:
    - type: adr
      initialStatus: proposed
      identity: {kind: explicit, format: adr-four-digits}
      placement: {kind: collection, directory: docs/decisions, filename: numeric-id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/adr.md}
      heading: {kind: id-colon-title}
      reachability: {kind: manual-fixed-index, indexPath: docs/decisions/README.md}
      allowedOwnerIds: [architecture, architecture/tooling]
    - type: open-decision
      initialStatus: open
      identity: {kind: explicit, format: open-decision-three-digits}
      placement: {kind: collection, directory: docs/open-decisions, filename: id-slug}
      template: {kind: fenced-markdown-body, path: docs/templates/open-decision.md}
      heading: {kind: id-colon-title}
      reachability: {kind: manual-fixed-index, indexPath: docs/open-decisions/README.md}
      allowedOwnerIds: [architecture, architecture/tooling]
    - type: qualification
      initialStatus: reviewed
      identity: {kind: explicit, format: qualified, grammar: {prefixSegments: [qualification], minSuffixSegments: 1, maxSuffixSegments: 3}}
      placement: {kind: qualified-leaf-index, root: docs/qualification, requiredBasename: README.md}
      template: {kind: fenced-markdown-body, path: docs/templates/qualification.md}
      heading: {kind: title}
      reachability: {kind: not-required, reason: qualification records are linked by hand from the docs/README.md evidence section}
      allowedOwnerIds: [architecture, architecture/tooling]
